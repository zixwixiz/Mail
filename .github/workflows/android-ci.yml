name: Android CI
# CI build and GitHub Release for JLU Mail

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --no-daemon

      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: jlu-mail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JLU Mail build ${{ github.run_number }}
          body: |
            JLU Mail debug APK build ${{ github.run_number }}.

            Commit: ${{ github.sha }}
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
